[package]
name = "weather-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Friendly US weather by city, coordinates, API, CLI, and MCP"
publish = false

[dependencies]
aide = { version = "=0.16.0-alpha.4", features = ["axum-json", "axum-query"] }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.5", features = ["transport-io", "transport-streamable-http-server"] }
rstar = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.6.11", features = ["trace", "timeout", "limit", "set-header", "compression-gzip", "compression-br", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
